server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page only talks to its own files and Scryfall's API.
    # Keep in step with the meta CSP in index.html (which can't carry frame-ancestors).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.scryfall.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The page uses none of these. clipboard-write stays allowed for the Copy button.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
