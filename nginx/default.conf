server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page only talks to its own files and Scryfall's API.
    add_header Content-Security-Policy "default-src 'self'; connect-src https://api.scryfall.com; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
